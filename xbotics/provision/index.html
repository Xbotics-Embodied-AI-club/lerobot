<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星禾套件 · 网络设置</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: #52606d; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card, section { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  section { margin-top: 14px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .row { margin: 4px 0; font-size: 14px; display: flex; }
  .label { color: #52606d; flex: none; min-width: 48px; }
  .field { font-size: 13px; color: #52606d; }
  .field input { margin-top: 3px; }
  .ok { color: #1a7f37; font-weight: 600; } .bad { color: #b42318; font-weight: 600; } .mid { color: #9a6700; font-weight: 600; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-size: 15px; cursor: pointer; }
  button.ghost { background: #e4e7eb; color: #1f2933; } button:disabled { opacity: .5; }
  input, select { font-size: 15px; padding: 8px 10px; border: 1px solid #cbd2d9; border-radius: 8px; width: 100%; box-sizing: border-box; }
  .net { display: flex; justify-content: space-between; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .net:hover, .net.sel { background: #e8f0fe; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* 钉在屏幕底边：手机上点完「连接」时人停在 Wi-Fi 那一节，结果要不用往下翻就看得到 */
  .msg { position: sticky; bottom: 12px; margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
         display: flex; gap: 10px; cursor: pointer; }
  .msg::after { content: "✕"; margin-left: auto; color: #52606d; }
  .msg[hidden] { display: none; }
  .msg.running { background: #fff7e6; } .msg.done { background: #e6f4ea; } .msg.failed { background: #fdecea; }
  a { color: #2563eb; } .links a { display: block; margin: 4px 0; } .links .host + .host { margin-top: 12px; }
  .hint { font-size: 13px; color: #52606d; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>星禾套件 · 网络设置</h1>
  <div class="sub"><b id="host">…</b> · <b id="mdns">…</b></div>

  <div class="cards">
    <div class="card"><h2>网线</h2><div id="eth"></div></div>
    <div class="card"><h2>Wi-Fi</h2><div id="wifi"></div></div>
    <div class="card"><h2>本热点</h2><div id="ap"></div></div>
  </div>

  <section id="links-box" hidden>
    <h2>从你自己的网络打开</h2>
    <div class="links" id="links"></div>
  </section>

  <section>
    <h2>连 Wi-Fi</h2>
    <button class="ghost" id="scan">扫描附近的 Wi-Fi</button>
    <div id="nets" style="margin-top:8px"></div>
    <div class="grid2" style="margin-top:8px">
      <input id="ssid" placeholder="Wi-Fi 名字">
      <input id="pw" type="password" placeholder="密码">
    </div>
    <div style="margin-top:8px"><button id="connect">连接</button></div>
    <div id="saved" class="hint"></div>
  </section>

  <section>
    <h2>网线</h2>
    <select id="mode"><option value="auto">自动获取地址（DHCP）</option><option value="manual">固定 IP</option></select>
    <div id="manual" hidden>
      <div class="grid2" style="margin-top:8px">
        <label class="field">地址<input id="addr" placeholder="如 192.168.1.50"></label>
        <label class="field">前缀长度<input id="prefix" placeholder="如 24" value="24"></label>
        <label class="field">网关<input id="gw" placeholder="如 192.168.1.1"></label>
        <label class="field">DNS（空格隔开）<input id="dns" value="223.5.5.5 119.29.29.29"></label>
      </div>
    </div>
    <div style="margin-top:8px"><button id="wired">保存</button></div>
  </section>

  <div id="msg" class="msg" hidden></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let wiredFilled = false;
let shownAt = 0, dismissedAt = -1;  // 点掉的那条消息不再弹；下一个操作的消息时刻不同，照常显示

function link(dev) {
  if (!dev.connected) return '<span class="bad">没连上</span>';
  return dev.online ? '<span class="ok">已连上 · 能上外网</span>' : '<span class="mid">已连上 · 上不了外网</span>';
}
function rows(dev, extra) {
  const r = [`<div class="row">${link(dev)}</div>`];
  if (extra) r.push(`<div class="row"><span class="label">网络</span>${esc(extra)}</div>`);
  if (dev.addresses.length) r.push(`<div class="row"><span class="label">地址</span>${esc(dev.addresses.join(", "))}</div>`);
  if (dev.gateway) r.push(`<div class="row"><span class="label">网关</span>${esc(dev.gateway)}</div>`);
  if (dev.dns.length) r.push(`<div class="row"><span class="label">DNS</span>${esc(dev.dns.join(" "))}</div>`);
  return r.join("");
}

async function refresh() {
  let s;
  try { s = await (await fetch("/api/status", {cache: "no-store"})).json(); } catch (e) { return; }
  $("host").textContent = s.hostname; $("mdns").textContent = s.mdns;
  $("eth").innerHTML = rows(s.ethernet, s.ethernet.method === "manual" ? "固定 IP" : (s.ethernet.method === "auto" ? "自动获取" : ""));
  $("wifi").innerHTML = rows(s.wifi, s.wifi.connection);
  $("ap").innerHTML = `<div class="row">${s.hotspot.up ? '<span class="ok">开着</span>' : '<span class="bad">没开</span>'}</div>` +
    `<div class="row"><span class="label">名字</span>${esc(s.hotspot.ssid)}</div><div class="row"><span class="label">地址</span>${esc(s.hotspot.address)}</div>`;
  const ips = [...s.ethernet.addresses, ...s.wifi.addresses].map((a) => a.split("/")[0]);
  $("links-box").hidden = ips.length === 0;
  // 六个网页服务连号：8001 本页 · 8002 网页终端 · 8003 JupyterLab · 8004 浏览器版 VS Code · 8005 硬件检测 · 8006 网页标定
  const services = [[8001, "网络设置"], [8002, "网页终端"], [8003, "JupyterLab"], [8004, "VS Code"], [8005, "硬件检测"], [8006, "网页标定"]];
  $("links").innerHTML = [s.mdns, ...ips].map((h) => `<div class="host">` + services.map(([port, name]) =>
    `<a href="http://${h}:${port}" target="_blank">${name} http://${esc(h)}:${port}</a>`).join("") + `</div>`).join("");
  $("saved").innerHTML = s.saved_wifi.length ? "已保存的 Wi-Fi：" + s.saved_wifi.map((n) =>
    `${esc(n)} <a href="#" data-forget="${esc(n)}">删掉</a>`).join("，") : "";
  if (!wiredFilled && s.ethernet.method) {
    wiredFilled = true;
    $("mode").value = s.ethernet.method === "manual" ? "manual" : "auto";
    $("manual").hidden = $("mode").value !== "manual";
    if (s.ethernet.addresses[0]) { const [a, p] = s.ethernet.addresses[0].split("/"); $("addr").value = a; $("prefix").value = p; }
    if (s.ethernet.gateway) $("gw").value = s.ethernet.gateway;
    if (s.ethernet.dns.length) $("dns").value = s.ethernet.dns.join(" ");
  }
  const j = s.job;
  shownAt = j.at;
  $("msg").hidden = j.state === "idle" || j.at === dismissedAt;
  $("msg").className = "msg " + j.state; $("msg").textContent = j.message;
  $("connect").disabled = $("wired").disabled = j.state === "running";
}

async function post(url, body) {
  await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  refresh();
}

$("scan").onclick = async () => {
  $("scan").disabled = true; $("scan").textContent = "扫描中…";
  try {
    const nets = await (await fetch("/api/networks", {cache: "no-store"})).json();
    $("nets").innerHTML = nets.map((n) => `<div class="net" data-ssid="${esc(n.ssid)}"><span>${esc(n.ssid)}${n.enterprise ? "（要账号，暂不支持）" : ""}</span><span>${n.signal}%${n.security ? " 🔒" : ""}</span></div>`).join("") || "没扫到 Wi-Fi";
  } finally { $("scan").disabled = false; $("scan").textContent = "重新扫描"; }
};
$("nets").onclick = (e) => {
  const el = e.target.closest(".net"); if (!el) return;
  document.querySelectorAll(".net").forEach((n) => n.classList.remove("sel")); el.classList.add("sel");
  $("ssid").value = el.dataset.ssid; $("pw").focus();
};
$("connect").onclick = () => post("/api/wifi", {ssid: $("ssid").value, password: $("pw").value});
$("saved").onclick = (e) => { const n = e.target.dataset.forget; if (n) { e.preventDefault(); post("/api/wifi/forget", {name: n}); } };
$("msg").onclick = () => { dismissedAt = shownAt; $("msg").hidden = true; };
$("mode").onchange =() => { $("manual").hidden = $("mode").value !== "manual"; };
$("wired").onclick = () => post("/api/wired", {mode: $("mode").value, address: $("addr").value, prefix: $("prefix").value,
  gateway: $("gw").value, dns: $("dns").value.split(/[\s,，]+/).filter(Boolean)});

refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
