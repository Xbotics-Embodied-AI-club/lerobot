name: 发布教程到 GitHub Pages

# 手动触发：在 Actions 页面选这个工作流，点 Run workflow。
# 网站内容在 docs/github-pages 分支，main 只放这个发布入口。
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbotics-docs-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Xbotics-Embodied-AI-club/lerobot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 读取网站分支
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/docs/github-pages
          persist-credentials: false

      - name: 生成网页
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" run --no-project --python 3.12 --with-requirements docs/requirements.txt \
            sphinx-build -E -a -b html docs docs/_build/html

      - name: 上传生成的网页
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
