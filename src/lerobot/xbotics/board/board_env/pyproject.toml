# 星禾套件板子上的 LeRobot 环境（/root/xbotics），由维护版 LeRobot 维护。xbotics-config update 升级时只改
# 维护版管的几项：Python 版本、下面这几个依赖、override-dependencies、LeRobot 的源；其余（自己 uv add 的包等）原样保留。
[project]
name = "xbotics-board"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = ["lerobot[feetech,async,dataset,viz,xbotics_tools]", "jupyterlab"]

[tool.uv]
package = false
override-dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchcodec; sys_platform == 'never'",
    "rerun-sdk==0.26.2",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/Xbotics-Embodied-AI-club/lerobot.git", tag = "xbotics-v0.6.1" }

[tool.xbotics]
managed-dependencies = ["jupyterlab", "lerobot"]
