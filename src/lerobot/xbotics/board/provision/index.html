<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<title>星禾套件 · 网络设置</title>
<style>
  /* 热点不通外网：字体、图标全部用系统自带与内联 SVG，不引任何外部资源 */
  :root {
    --navy: #1d3557; --blue: #2563eb; --blue-soft: #e8efff; --orange: #f08c2e;
    --bg: #f3f5f9; --card: #ffffff; --text: #18212f; --muted: #667085; --line: #e3e7ee; --field: #f8fafc;
    --ok: #12a150; --ok-soft: #e3f6ea; --mid: #c27803; --mid-soft: #fdf3dc; --bad: #d92d20; --bad-soft: #fde8e7;
    --idle: #98a2b3; --idle-soft: #eef0f4;
    --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1520; --card: #172131; --text: #e6ebf2; --muted: #93a0b4; --line: #26344a; --field: #111a27;
      --blue-soft: #1c2c4d; --ok-soft: #12321f; --mid-soft: #3a2c0c; --bad-soft: #3d1614; --idle-soft: #232f40;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  header { background: linear-gradient(135deg, #1d3557 0%, #24467a 60%, #2b5797 100%); color: #fff;
           padding: 22px 16px 58px; padding-top: max(22px, env(safe-area-inset-top)); }
  .head { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .logo { width: 46px; height: 46px; border-radius: 13px; background: rgba(255,255,255,.12); display: grid; place-items: center;
          box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .logo svg { width: 28px; height: 28px; stroke: #fff; }
  .logo .spark { stroke: var(--orange); }
  .brand { font-size: 13px; letter-spacing: .08em; opacity: .75; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: .02em; }
  .hostchips { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .hostchip { font-size: 12.5px; background: rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px;
              box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); white-space: nowrap; }

  main { max-width: 820px; margin: -42px auto 0; padding: 0 12px 96px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } .hostchips { display: none; } }
  .card, section { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card { padding: 14px 14px 12px; }
  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); }
  .card-title { font-weight: 600; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; font-variant-numeric: tabular-nums; }

  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; margin-left: auto; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); } .pill.mid { color: var(--mid); background: var(--mid-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); } .pill.idle { color: var(--idle); background: var(--idle-soft); }
  .pill.run::before { animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .25; } }

  section { margin-top: 12px; padding: 16px; }
  .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  h2 { margin: 0; font-size: 16.5px; font-weight: 650; }
  .sec-note { color: var(--muted); font-size: 13px; margin: -6px 0 12px 44px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line);
          color: var(--text); text-decoration: none; transition: border-color .15s, background .15s; }
  .tile:hover { border-color: var(--blue); background: var(--blue-soft); }
  .tile .ico { width: 30px; height: 30px; border-radius: 9px; }
  .tile .ico svg { width: 17px; height: 17px; }
  .tile b { display: block; font-weight: 600; font-size: 14px; } .tile small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tile.tun .ico { background: #fff1e3; color: var(--orange); }
  @media (prefers-color-scheme: dark) { .tile.tun .ico { background: #3a2a17; } }
  .seg-hosts { margin-bottom: 10px; }

  .btn { appearance: none; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
         background: var(--blue); color: #fff; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  .btn:hover { filter: brightness(1.06); } .btn:disabled { opacity: .45; cursor: default; filter: none; }
  .btn.ghost { background: var(--blue-soft); color: var(--blue); } .btn.plain { background: transparent; color: var(--muted); padding: 10px 10px; }
  .btn.danger { background: var(--bad-soft); color: var(--bad); }
  .btn svg { width: 17px; height: 17px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  @media (max-width: 640px) { .actions .btn:not(.plain) { flex: 1; } }

  label.f { display: block; font-size: 13px; color: var(--muted); }
  label.f > span { display: block; margin-bottom: 4px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line);
                    border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea { font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 112px; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 2fr 1fr 1.3fr; gap: 10px; }
  @media (max-width: 520px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  .pw { position: relative; } .pw input { padding-right: 44px; }
  .pw button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); padding: 8px; cursor: pointer; }

  .seg { display: inline-flex; background: var(--idle-soft); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; font: inherit; font-size: 14px; color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(16,24,40,.12); }

  .nets { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; margin: 10px 0 12px; }
  .nets:empty { display: none; }
  .net { display: flex; align-items: center; gap: 10px; padding: 11px 12px; cursor: pointer; border-top: 1px solid var(--line); }
  .net:first-child { border-top: 0; } .net:hover { background: var(--field); } .net.sel { background: var(--blue-soft); }
  .net .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net .name small { color: var(--muted); margin-left: 6px; }
  .net .lock { width: 15px; height: 15px; color: var(--muted); }
  .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .bars i { width: 4px; border-radius: 1px; background: var(--line); }
  .bars i:nth-child(1) { height: 25%; } .bars i:nth-child(2) { height: 50%; } .bars i:nth-child(3) { height: 75%; } .bars i:nth-child(4) { height: 100%; }
  .bars i.on { background: var(--blue); }
  .empty { padding: 14px; color: var(--muted); text-align: center; font-size: 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--idle-soft); color: var(--text); border-radius: 999px; padding: 3px 4px 3px 10px; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: 999px; }
  .chip button:hover { background: var(--bad-soft); color: var(--bad); }

  .fwd { display: grid; grid-template-columns: 1.4fr 1fr auto 1.2fr auto; gap: 8px; align-items: center; margin-top: 8px; }
  .fwd .arrow { color: var(--muted); }
  .fwd-head { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
  .fwd-head > span:last-child { width: 36px; }
  /* 手机上：名字占一行，下一行「板子端口 → 服务器端口」 */
  @media (max-width: 520px) {
    .fwd { grid-template-columns: 1fr auto 1fr auto; padding: 10px; border: 1px solid var(--line); border-radius: 11px; }
    .fwd .n { grid-column: 1 / -1; }
    .fwd-head { display: none; }
    .actions .btn:first-child { flex-basis: 100%; }
  }
  .fwd .x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 8px; border-radius: 8px; }
  .fwd .x:hover { background: var(--bad-soft); color: var(--bad); }
  .maps { margin-top: 12px; border: 1px solid var(--line); border-radius: 11px; }
  .maps:empty { display: none; }
  .map { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13.5px; flex-wrap: wrap; }
  .map:first-child { border-top: 0; }
  .map .route { color: var(--muted); font-variant-numeric: tabular-nums; }
  .map a { color: var(--blue); font-weight: 600; text-decoration: none; }
  .tun-err { margin-top: 10px; padding: 9px 12px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: 13.5px; }
  .tun-err:empty { display: none; }
  .hidden { display: none !important; }

  /* 钉在屏幕底边：手机上点完按钮时人停在那一节，结果不用往下翻就看得到 */
  .toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
           width: min(780px, calc(100% - 24px)); display: flex; align-items: center; gap: 10px; padding: 12px 14px;
           border-radius: 12px; background: var(--card); box-shadow: 0 8px 30px rgba(16,24,40,.22); cursor: pointer; font-size: 14px;
           border-left: 4px solid var(--idle); }
  .toast[hidden] { display: none; }
  .toast.running { border-left-color: var(--mid); } .toast.done { border-left-color: var(--ok); } .toast.failed { border-left-color: var(--bad); }
  .toast .t-ico { color: var(--idle); } .toast.running .t-ico { color: var(--mid); } .toast.done .t-ico { color: var(--ok); } .toast.failed .t-ico { color: var(--bad); }
  .toast .t-x { margin-left: auto; color: var(--muted); }
  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-eth" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M8 16v5h8v-5M8 7v3M12 7v3M16 7v3"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-ap" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></symbol>
  <symbol id="i-brain" viewBox="0 0 24 24"><path d="M12 5a3 3 0 0 0-5.6 1.5A3 3 0 0 0 4 11a3 3 0 0 0 1.5 5.6A3 3 0 0 0 12 19zM12 5a3 3 0 0 1 5.6 1.5A3 3 0 0 1 20 11a3 3 0 0 1-1.5 5.6A3 3 0 0 1 12 19"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></symbol>
  <symbol id="i-load" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
</svg>

<header>
  <div class="head">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 21V9M12 13c-3.5 0-6-2.2-6-6 3.5 0 6 2.2 6 6zM12 11c0-3.3 2.2-5.5 5.5-5.5 0 3.3-2.2 5.5-5.5 5.5z"/><path class="spark" d="M18.5 15.5l.8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8z"/></svg></div>
    <div><div class="brand">星禾套件</div><h1>网络设置</h1></div>
    <div class="hostchips"><span class="hostchip" id="host">…</span><span class="hostchip" id="mdns">…</span></div>
  </div>
</header>

<main>
  <div class="cards">
    <div class="card"><div class="card-top"><div class="ico"><svg><use href="#i-eth"/></svg></div><span class="card-title">网线</span><span id="eth-pill" class="pill idle">…</span></div><dl class="kv" id="eth"></dl></div>
    <div class="card"><div class="card-top"><div class="ico"><svg><use href="#i-wifi"/></svg></div><span class="card-title">Wi-Fi</span><span id="wifi-pill" class="pill idle">…</span></div><dl class="kv" id="wifi"></dl></div>
    <div class="card"><div class="card-top"><div class="ico"><svg><use href="#i-ap"/></svg></div><span class="card-title">本热点</span><span id="ap-pill" class="pill idle">…</span></div><dl class="kv" id="ap"></dl></div>
  </div>

  <section id="links-box" hidden>
    <div class="sec-head"><div class="ico"><svg><use href="#i-grid"/></svg></div><h2>从你自己的网络打开</h2></div>
    <div class="seg seg-hosts" id="hosts"></div>
    <div class="tiles" id="links"></div>
  </section>

  <section>
    <div class="sec-head"><div class="ico"><svg><use href="#i-wifi"/></svg></div><h2>连 Wi-Fi</h2></div>
    <button class="btn ghost" id="scan"><svg><use href="#i-scan"/></svg><span>扫描附近的 Wi-Fi</span></button>
    <div class="nets" id="nets"></div>
    <div class="grid2" style="margin-top:10px">
      <label class="f"><span>Wi-Fi 名字</span><input id="ssid" placeholder="在上面点一个，或手动填" autocomplete="off"></label>
      <label class="f"><span>密码</span><div class="pw"><input id="pw" type="password" placeholder="没有密码就留空" autocomplete="off"><button type="button" data-eye="pw" aria-label="显示密码"><svg><use href="#i-eye"/></svg></button></div></label>
    </div>
    <div class="actions"><button class="btn" id="connect">连接</button></div>
    <div class="chips" id="saved"></div>
  </section>

  <section>
    <div class="sec-head"><div class="ico"><svg><use href="#i-eth"/></svg></div><h2>网线</h2></div>
    <div class="seg" id="mode"><button data-v="auto" class="on">自动获取（DHCP）</button><button data-v="manual">固定 IP</button></div>
    <div id="manual" hidden>
      <div class="grid2" style="margin-top:12px">
        <label class="f"><span>地址</span><input id="addr" placeholder="如 192.168.1.50" inputmode="decimal"></label>
        <label class="f"><span>前缀长度</span><input id="prefix" placeholder="如 24" value="24" inputmode="numeric"></label>
        <label class="f"><span>网关</span><input id="gw" placeholder="如 192.168.1.1" inputmode="decimal"></label>
        <label class="f"><span>DNS（空格隔开）</span><input id="dns" value="223.5.5.5 119.29.29.29"></label>
      </div>
    </div>
    <div class="actions"><button class="btn" id="wired">保存</button></div>
  </section>

  <section>
    <div class="sec-head"><div class="ico"><svg><use href="#i-server"/></svg></div><h2>连服务器</h2><span id="tun-pill" class="pill idle">没设置</span></div>
    <div class="sec-note">经 SSH 把服务器上的推理服务、TensorBoard 映射到板子：板子上的程序连 127.0.0.1，你的电脑连板子的 IP。断了会自己重连。</div>
    <div class="grid3">
      <label class="f"><span>服务器地址</span><input id="t-host" placeholder="IP 或域名" autocomplete="off" autocapitalize="off"></label>
      <label class="f"><span>SSH 端口</span><input id="t-port" value="22" inputmode="numeric"></label>
      <label class="f"><span>账号</span><input id="t-user" placeholder="如 root" autocomplete="off" autocapitalize="off"></label>
    </div>
    <div style="margin-top:12px" class="seg" id="t-auth"><button data-v="password" class="on">账号密码</button><button data-v="key">私钥</button></div>
    <div id="t-pass-box" style="margin-top:10px">
      <label class="f"><span>密码</span><div class="pw"><input id="t-pass" type="password" autocomplete="off"><button type="button" data-eye="t-pass" aria-label="显示密码"><svg><use href="#i-eye"/></svg></button></div></label>
    </div>
    <div id="t-key-box" class="hidden" style="margin-top:10px">
      <label class="f"><span>私钥（整段粘贴，或 <a href="#" id="t-key-pick" style="color:var(--blue)">选一个文件</a>）</span><textarea id="t-key" spellcheck="false" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;…&#10;-----END OPENSSH PRIVATE KEY-----"></textarea></label>
      <input type="file" id="t-key-file" class="hidden">
      <label class="f" style="margin-top:10px"><span>私钥口令（没有就留空）</span><div class="pw"><input id="t-phrase" type="password" autocomplete="off"><button type="button" data-eye="t-phrase" aria-label="显示口令"><svg><use href="#i-eye"/></svg></button></div></label>
    </div>
    <div class="fwd fwd-head"><span>映射什么</span><span>板子端口</span><span></span><span>服务器端口</span><span></span></div>
    <div id="t-fwds"></div>
    <div class="actions">
      <button class="btn" id="t-save"><svg><use href="#i-plug"/></svg>保存并连接</button>
      <button class="btn ghost" id="t-add"><svg><use href="#i-plus"/></svg>加一条映射</button>
      <button class="btn danger hidden" id="t-stop">断开</button>
    </div>
    <div class="tun-err" id="t-err"></div>
    <div class="maps" id="t-maps"></div>
  </section>
</main>

<div id="msg" class="toast" hidden><svg class="t-ico"><use href="#i-check"/></svg><span id="msg-text"></span><svg class="t-x"><use href="#i-x"/></svg></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const icon = (name, cls = "") => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
let wiredFilled = false, tunnelFilled = false, pickedHost = null, lastStatus = null, lastTunnel = null;
let shownAt = 0, dismissedAt = -1;  // 点掉的那条消息不再弹；下一个操作的消息时刻不同，照常显示

// 七个网页服务连号：8001 本页 · 8002 网页终端 · 8003 JupyterLab · 8004 浏览器版 VS Code · 8005 硬件检测 · 8006 网页标定
const SERVICES = [[8001, "网络设置", "gear"], [8002, "网页终端", "term"], [8003, "JupyterLab", "book"],
                  [8004, "VS Code", "code"], [8005, "硬件检测", "chip"], [8006, "网页标定", "target"]];

function segValue(id) { return $(id).querySelector("button.on").dataset.v; }
function setSeg(id, v) { $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === v)); }
function setPill(id, cls, text) { $(id).className = "pill " + cls; $(id).textContent = text; }
function linkPill(dev) {
  if (!dev.connected) return ["bad", "没连上"];
  return dev.online ? ["ok", "能上外网"] : ["mid", "上不了外网"];
}
function kv(pairs) { return pairs.filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join(""); }

function renderLinks(s) {
  const ips = [...s.ethernet.addresses, ...s.wifi.addresses].map((a) => a.split("/")[0]);
  const hosts = [s.mdns, ...ips];
  $("links-box").hidden = ips.length === 0;
  if (!hosts.includes(pickedHost)) pickedHost = ips[0] || s.mdns;
  $("hosts").innerHTML = hosts.map((h) => `<button data-v="${esc(h)}" class="${h === pickedHost ? "on" : ""}">${esc(h)}</button>`).join("");
  const h = pickedHost;
  const tun = (lastTunnel && lastTunnel.state === "active") ? lastTunnel.forwards.filter((f) => f.web !== false) : [];
  $("links").innerHTML = SERVICES.map(([port, name, ico]) =>
    `<a class="tile" href="http://${esc(h)}:${port}" target="_blank"><span class="ico">${icon(ico)}</span><span><b>${name}</b><small>${port}</small></span></a>`).join("") +
    tun.map((f) => `<a class="tile tun" href="http://${esc(h)}:${f.local}" target="_blank"><span class="ico">${icon("chart")}</span><span><b>${esc(f.name)}</b><small>${f.local} · 服务器</small></span></a>`).join("");
}

async function refresh() {
  let s;
  try { s = await (await fetch("/api/status", {cache: "no-store"})).json(); } catch (e) { return; }
  lastStatus = s;
  $("host").textContent = s.hostname; $("mdns").textContent = s.mdns;
  setPill("eth-pill", ...linkPill(s.ethernet));
  $("eth").innerHTML = kv([["方式", s.ethernet.method === "manual" ? "固定 IP" : (s.ethernet.method === "auto" ? "自动获取" : "")],
    ["地址", s.ethernet.addresses.join(", ")], ["网关", s.ethernet.gateway], ["DNS", s.ethernet.dns.join(" ")]]);
  setPill("wifi-pill", ...linkPill(s.wifi));
  $("wifi").innerHTML = kv([["网络", s.wifi.connected ? s.wifi.connection : ""], ["地址", s.wifi.addresses.join(", ")],
    ["网关", s.wifi.gateway], ["DNS", s.wifi.dns.join(" ")]]);
  setPill("ap-pill", ...(s.hotspot.up ? ["ok", "开着"] : ["bad", "没开"]));
  $("ap").innerHTML = kv([["名字", s.hotspot.ssid], ["地址", s.hotspot.address], ["密码", "不设密码"]]);
  renderLinks(s);
  $("saved").innerHTML = s.saved_wifi.length ? "<span>已保存：</span>" + s.saved_wifi.map((n) =>
    `<span class="chip">${esc(n)}<button data-forget="${esc(n)}" title="删掉">×</button></span>`).join("") : "";
  if (!wiredFilled && s.ethernet.method) {
    wiredFilled = true;
    setSeg("mode", s.ethernet.method === "manual" ? "manual" : "auto");
    $("manual").hidden = segValue("mode") !== "manual";
    if (s.ethernet.addresses[0]) { const [a, p] = s.ethernet.addresses[0].split("/"); $("addr").value = a; $("prefix").value = p; }
    if (s.ethernet.gateway) $("gw").value = s.ethernet.gateway;
    if (s.ethernet.dns.length) $("dns").value = s.ethernet.dns.join(" ");
  }
  const j = s.job;
  shownAt = j.at;
  $("msg").hidden = j.state === "idle" || j.at === dismissedAt;
  $("msg").className = "toast " + j.state; $("msg-text").textContent = j.message;
  $("msg").querySelector(".t-ico").outerHTML = icon({running: "load", done: "check", failed: "alert"}[j.state] || "check", "t-ico" + (j.state === "running" ? " spin" : ""));
  const busy = j.state === "running";
  $("connect").disabled = $("wired").disabled = $("t-save").disabled = busy;
}

function fwdRow(f = {}) {
  const remote = f.remote ? ((f.remote_host && f.remote_host !== "127.0.0.1") ? `${f.remote_host}:${f.remote}` : String(f.remote)) : "";
  const row = document.createElement("div");
  row.className = "fwd";
  row.dataset.web = f.web === false ? "0" : "1";
  row.innerHTML = `<input class="n" placeholder="映射什么，如 TensorBoard" value="${esc(f.name || "")}">` +
    `<input class="l" inputmode="numeric" placeholder="板子端口" title="板子端口" value="${esc(f.local || "")}"><span class="arrow">→</span>` +
    `<input class="r" placeholder="服务器端口" title="服务器端口；不在服务器本机的写 地址:端口" value="${esc(remote)}"><button class="x" title="删掉这条">${icon("x")}</button>`;
  row.querySelector(".x").onclick = () => row.remove();
  $("t-fwds").appendChild(row);
}
function readFwds() {
  return [...$("t-fwds").children].map((row) => {
    const r = row.querySelector(".r").value.trim(), l = row.querySelector(".l").value.trim();
    const m = r.match(/^(.+):(\d+)$/);
    return {name: row.querySelector(".n").value.trim(), local: l, remote_host: m ? m[1] : "127.0.0.1", remote: m ? m[2] : (r || l), web: row.dataset.web !== "0"};
  }).filter((f) => f.local || f.remote);
}

async function refreshTunnel() {
  let t;
  try { t = await (await fetch("/api/tunnel", {cache: "no-store"})).json(); } catch (e) { return; }
  lastTunnel = t;
  if (!tunnelFilled) {
    tunnelFilled = true;
    $("t-host").value = t.host; $("t-port").value = t.port || 22; $("t-user").value = t.user;
    setSeg("t-auth", t.auth); showAuth();
    $("t-pass").placeholder = t.has_password ? "已保存，不改就留空" : "";
    $("t-key").placeholder = t.has_key ? "已保存私钥，不换就留空" : $("t-key").placeholder;
    $("t-fwds").innerHTML = ""; t.forwards.forEach(fwdRow);
  }
  const states = {active: ["ok", "已连上"], activating: ["mid run", "连接中"], failed: ["bad", "没连上"]};
  let pill = !t.configured ? ["idle", "没设置"] : !t.enabled ? ["idle", "已断开"] : (states[t.state] || ["mid run", "重连中"]);
  if (t.enabled && t.state === "active" && t.forwards.some((f) => t.probes[f.local] === "down")) pill = ["mid run", "连接中"];
  setPill("tun-pill", ...pill);
  $("t-stop").classList.toggle("hidden", !t.enabled);
  $("t-err").textContent = t.enabled && t.state !== "active" ? t.error : "";
  const ip = lastStatus ? [...lastStatus.ethernet.addresses, ...lastStatus.wifi.addresses].map((a) => a.split("/")[0])[0] : "";
  $("t-maps").innerHTML = (t.enabled && t.state === "active") ? t.forwards.map((f) => {
    const p = t.probes[f.local];
    const st = p === "ok" ? ["ok", "通"] : p === "closed" ? ["mid", "服务器上这个端口没有服务"] : p === "down" ? ["bad", "没映射上"] : ["idle", "…"];
    const open = (p === "ok" && f.web !== false && ip) ? `<a href="http://${esc(ip)}:${f.local}" target="_blank">打开</a>` : "";
    return `<div class="map"><b>${esc(f.name)}</b><span class="route">板子 0.0.0.0:${f.local} → 服务器 ${esc(f.remote_host)}:${f.remote}</span>${open}<span class="pill ${st[0]}">${st[1]}</span></div>`;
  }).join("") : "";
  if (lastStatus) renderLinks(lastStatus);
}

async function post(url, body) {
  await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  refresh();
}
function showAuth() {
  const key = segValue("t-auth") === "key";
  $("t-key-box").classList.toggle("hidden", !key); $("t-pass-box").classList.toggle("hidden", key);
}

$("scan").onclick = async () => {
  $("scan").disabled = true; $("scan").querySelector("span").textContent = "扫描中…"; $("scan").querySelector("svg").classList.add("spin");
  try {
    const nets = await (await fetch("/api/networks", {cache: "no-store"})).json();
    $("nets").innerHTML = nets.map((n) => {
      const lvl = Math.max(1, Math.ceil(n.signal / 25));
      const bars = [1, 2, 3, 4].map((k) => `<i class="${k <= lvl ? "on" : ""}"></i>`).join("");
      return `<div class="net" data-ssid="${esc(n.ssid)}"><span class="name">${esc(n.ssid)}${n.enterprise ? "<small>要账号，暂不支持</small>" : ""}</span>` +
        `${n.security ? icon("lock", "lock") : ""}<span class="bars" title="${n.signal}%">${bars}</span></div>`;
    }).join("") || `<div class="empty">没扫到 Wi-Fi，靠近路由器再扫一次</div>`;
  } finally {
    $("scan").disabled = false; $("scan").querySelector("span").textContent = "重新扫描"; $("scan").querySelector("svg").classList.remove("spin");
  }
};
$("nets").onclick = (e) => {
  const el = e.target.closest(".net"); if (!el) return;
  document.querySelectorAll(".net").forEach((n) => n.classList.remove("sel")); el.classList.add("sel");
  $("ssid").value = el.dataset.ssid; $("pw").focus();
};
$("connect").onclick = () => post("/api/wifi", {ssid: $("ssid").value, password: $("pw").value});
$("saved").onclick = (e) => { const n = e.target.dataset.forget; if (n) post("/api/wifi/forget", {name: n}); };
$("msg").onclick = () => { dismissedAt = shownAt; $("msg").hidden = true; };
$("mode").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; setSeg("mode", b.dataset.v); $("manual").hidden = b.dataset.v !== "manual"; };
$("hosts").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; pickedHost = b.dataset.v; if (lastStatus) renderLinks(lastStatus); };
$("wired").onclick = () => post("/api/wired", {mode: segValue("mode"), address: $("addr").value, prefix: $("prefix").value,
  gateway: $("gw").value, dns: $("dns").value.split(/[\s,，]+/).filter(Boolean)});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-eye]"); if (!b) return;
  const inp = $(b.dataset.eye); inp.type = inp.type === "password" ? "text" : "password";
});
$("t-auth").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; setSeg("t-auth", b.dataset.v); showAuth(); };
$("t-key-pick").onclick = (e) => { e.preventDefault(); $("t-key-file").click(); };
$("t-key-file").onchange = async () => { const f = $("t-key-file").files[0]; if (f) $("t-key").value = (await f.text()).trim(); };
$("t-add").onclick = () => fwdRow();
$("t-save").onclick = () => post("/api/tunnel", {host: $("t-host").value, port: $("t-port").value, user: $("t-user").value,
  auth: segValue("t-auth"), password: $("t-pass").value, key: $("t-key").value, passphrase: $("t-phrase").value, forwards: readFwds()})
  .then(() => setTimeout(refreshTunnel, 1500));
$("t-stop").onclick = () => post("/api/tunnel/stop").then(() => setTimeout(refreshTunnel, 800));

refresh(); refreshTunnel();
setInterval(refresh, 2000); setInterval(refreshTunnel, 4000);
</script>
</body>
</html>
