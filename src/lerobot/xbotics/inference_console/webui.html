<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3557">
<title>星禾套件 · 推理</title>
<style>
/* 与网络设置页同一套配色与字体；只用系统字体，不引用外部资源 */
:root{
  --navy:#1d3557; --blue:#2563eb; --blue-soft:#e8efff; --orange:#f08c2e;
  --bg:#f3f5f9; --card:#fff; --text:#18212f; --muted:#667085; --line:#e3e7ee; --field:#f8fafc;
  --ok:#12a150; --ok-soft:#e3f6ea; --mid:#c27803; --mid-soft:#fdf3dc; --bad:#d92d20; --bad-soft:#fde8e7;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
header{background:linear-gradient(135deg,#1d3557 0%,#24467a 60%,#2b5797 100%);color:#fff;padding:16px 18px 50px}
.head{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:12.5px;letter-spacing:.08em;opacity:.75}
h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.02em}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 11px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.ok{background:#4ade80}.dot.bad{background:#f87171}.dot.mid{background:#fbbf24}
main{max-width:1400px;margin:-36px auto 0;padding:0 14px 24px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:minmax(300px,1fr) minmax(380px,1.6fr) minmax(300px,1.1fr);gap:12px}
@media (max-width:1100px){.row{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.card-title{font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-title .aside{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
input,select{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
input:focus,select:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:7px 14px;cursor:pointer;white-space:nowrap;
  background:var(--blue-soft);color:var(--blue)}
button:hover{filter:brightness(.97)}
button.primary{background:var(--blue);color:#fff}
#ctrlBtn{width:100%;padding:10px;font-size:15px;margin-top:10px}
#ctrlBtn.stop{background:var(--bad-soft);color:var(--bad)}
#ctrlBtn.start{background:var(--ok);color:#fff}
.taskrow{display:flex;gap:6px}
#task{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.mid{background:var(--mid-soft);color:var(--mid)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
#stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.tile .s{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
#q{width:100%;height:84px;display:block;border-radius:8px;background:var(--field)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.b{width:10px;height:10px;display:inline-block;margin-right:5px;border-radius:2px;vertical-align:-1px}
#rtc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px;align-items:end}
#rtc label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
#rtc label.check{flex-direction:row;align-items:center;gap:6px;color:var(--text);font-size:13px;padding-bottom:6px}
#rtc input[type=number]{width:100%}
#rtc .actions{display:flex;gap:8px;margin-top:10px}
#cams{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
#cams .cam{background:#0b0f17;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
#cams .cap{font-size:12px;color:#cbd5e1;padding:5px 10px;background:#111827}
#cams img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}
#camsEmpty{color:var(--muted);font-size:13px;padding:6px 0}
</style></head><body>
<header><div class="head">
  <div><div class="brand">星禾套件</div><h1>推理控制台</h1></div>
  <div class="chips"><span class="chip"><span class="dot" id="runDot"></span><span id="runText">连接中</span></span>
    <span class="chip">推理服务 <span id="serverText">--</span></span></div>
</div></header>
<main>
<div class="row">
  <div class="card">
    <div class="card-title">任务 <span class="aside"><span class="pill" id="taskPill">--</span></span></div>
    <div class="taskrow"><input id="task" placeholder="任务描述">
      <select id="preset" onchange="applyPreset()"><option value="">预设</option></select>
      <button onclick="setTask()">更新</button></div>
    <button id="ctrlBtn" onclick="toggleControl()">停止任务</button>
  </div>
  <div class="card">
    <div class="card-title">运行状态</div>
    <div id="stats">加载中…</div>
  </div>
  <div class="card">
    <div class="card-title">动作队列 <span class="aside" id="qinfo"></span></div>
    <canvas id="q"></canvas>
    <div class="legend">
      <span><span class="b" style="background:#22c55e"></span>新动作块</span>
      <span><span class="b" style="background:#f59e0b"></span>新旧融合</span>
      <span><span class="b" style="background:#9ca3af"></span>旧动作块</span>
      <span><span class="b" style="background:#ef4444;width:3px"></span>执行位置</span>
    </div>
  </div>
</div>
<div class="card">
  <div class="card-title">运行参数 <span class="aside" id="rtcMsg">修改后点击「应用」，下一个控制周期生效</span></div>
  <div id="rtc"></div>
</div>
<div class="card">
  <div class="card-title">相机画面 <span class="aside"><label title="关闭后不采集、不编码画面，节省 CPU">显示 <input type="checkbox" id="videoEnabled" onchange="toggleVideo()" checked></label></span></div>
  <div id="cams"></div><div id="camsEmpty">等待画面…</div>
</div>
</main>
<script>
let camsInit = false;
const fmt = (v, d = 0) => (v == null || isNaN(v)) ? '--' : Number(v).toFixed(d);
function tile(k, v, unit, sub){
  return `<div class="tile"><div class="k">${k}</div><div class="v">${v}${unit ? `<small>${unit}</small>` : ''}</div>` +
    (sub ? `<div class="s">${sub}</div>` : '') + '</div>';
}
async function tick(){
  try{
    const s = await (await fetch('/api/status')).json();
    if(document.activeElement !== document.getElementById('task'))
      document.getElementById('task').value = s.task;
    document.getElementById('runDot').className = 'dot ' + (s.running ? 'ok' : 'bad');
    document.getElementById('runText').textContent = s.running ? '运行中' : '已停止';
    document.getElementById('serverText').textContent = s.server;
    const pill = document.getElementById('taskPill');
    pill.className = 'pill ' + (s.task_active ? 'ok' : 'mid');
    pill.textContent = s.task_active ? '执行中' : '已暂停';
    const usage = s.chunk_usage_ratio == null ? '--' : fmt(s.chunk_usage_ratio * 100);
    const usageAvg = s.chunk_usage_ratio_avg == null ? '' : `均值 ${fmt(s.chunk_usage_ratio_avg * 100)}%（${s.chunk_usage_samples} 块）`;
    document.getElementById('stats').innerHTML =
      tile('控制循环', fmt(s.measured_fps, 1), 'Hz', `目标 ${s.fps} Hz`) +
      tile('推理延迟', fmt(s.infer_ms), 'ms', 'RTC ' + (s.rtc ? '开' : '关')) +
      tile('队列余量', `${s.queue_size}/${s.chunk_size}`, '', '当前动作块剩余步数') +
      tile('已执行步数', s.latest_action, '', `已发送动作 ${s.actions_sent}`) +
      tile('观测采集', fmt(s.obs_capture_fps, 1), 'Hz', `读取 ${fmt(s.obs_ms, 1)} ms`) +
      tile('执行动作', fmt(s.action_ms, 1), 'ms', '每步写入舵机') +
      tile('动作块使用率', usage, usage === '--' ? '' : '%', usageAvg) +
      (s.chunk_blend_ratio_avg == null ? '' : tile('融合段占比', fmt(s.chunk_blend_ratio_avg * 100), '%', '新旧动作块重叠部分'));
    document.getElementById('qinfo').textContent = `${s.queue_size} / ${s.chunk_size}`;
    const vEl = document.getElementById('videoEnabled');
    if(document.activeElement !== vEl) vEl.checked = !!s.video_enabled;
    document.getElementById('camsEmpty').style.display = (s.video_enabled && s.cams.length) ? 'none' : 'block';
    document.getElementById('camsEmpty').textContent = s.video_enabled ? '等待画面…' : '画面已关闭';
    if(!s.video_enabled){
      document.getElementById('cams').innerHTML = '';
      camsInit = false;
    } else if(!camsInit && s.cams.length){
      camsInit = true;
      const div = document.getElementById('cams');
      div.innerHTML = '';
      s.cams.forEach(c => {
        const d = document.createElement('div');
        d.className = 'cam';
        d.innerHTML = `<div class="cap">${c}</div><img src="/stream/${encodeURIComponent(c)}">`;
        div.appendChild(d);
      });
    }
  }catch(e){}
}
async function toggleVideo(){
  const en = document.getElementById('videoEnabled').checked;
  await fetch('/api/video', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({enabled: en})});
  camsInit = false;
}
async function tickQ(){
  try{
    const d = await (await fetch('/api/queue')).json();
    const c = document.getElementById('q'), x = c.getContext('2d');
    c.width = c.clientWidth; c.height = c.clientHeight || 72;
    const W = c.width, H = c.height;
    const barTop = 6, barH = H - 26;   // 底部留 20px 给 alpha/ts 文字
    // 每个动作块固定宽度（22px），背景画出 chunk 容量槽位，空槽即余量缺口；
    // 槽位数超出画布时才等比缩小
    const slots = Math.max(d.chunk_size || 0, d.entries.length, 1);
    const bw = Math.min(22, W / slots);
    x.clearRect(0, 0, W, H);
    x.font = '10px sans-serif';
    x.fillStyle = '#e5e7eb';
    for(let i = 0; i < slots; i++) x.fillRect(i * bw, barTop, Math.max(bw - 2, 1), barH);
    d.entries.forEach((e, i) => {
      let col = '#9ca3af';
      if(e.src === 'new') col = '#22c55e';
      else if(e.src === 'agg') col = '#60a5fa';
      else if(e.src === 'blend'){
        const g = Math.round(110 + e.alpha * 90);
        col = `rgb(245,${g},11)`;  // alpha 越大越亮
      }
      x.fillStyle = col;
      x.fillRect(i * bw, barTop, Math.max(bw - 2, 1), barH);
      if(e.src === 'blend' && bw > 26){
        x.fillStyle = '#000';
        x.fillText(e.alpha.toFixed(2), i * bw + 2, barTop + barH + 11);
      }
      if(i % Math.ceil(slots / 8) === 0){
        x.fillStyle = '#667085';
        x.fillText(e.ts, i * bw + 1, H - 3);
      }
    });
    // 执行指针（latest_action 之后即为队首）
    x.fillStyle = '#ef4444';
    x.fillRect(0, 0, 3, barTop + barH + 2);
  }catch(e){}
}
async function toggleControl(){
  const cur = document.getElementById('ctrlBtn').dataset.active === '1';
  await fetch('/api/control', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({task_active: !cur})});
}
async function tickControl(){
  try{
    const s = await (await fetch('/api/status')).json();
    const b = document.getElementById('ctrlBtn');
    b.dataset.active = s.task_active ? '1' : '0';
    b.textContent = s.task_active ? '停止任务' : '启动任务';
    b.className = s.task_active ? 'stop' : 'start';
  }catch(e){}
}
setInterval(tickControl, 500); tickControl();
let presetsLoaded = false;
async function loadPresets(){
  try{
    const d = await (await fetch('/api/task_presets')).json();
    const sel = document.getElementById('preset');
    Object.entries(d.presets || {}).forEach(([name, text]) => {
      const o = document.createElement('option');
      o.value = text; o.textContent = name;
      sel.appendChild(o);
    });
    presetsLoaded = true;
  }catch(e){}
}
function applyPreset(){
  const sel = document.getElementById('preset');
  if(!sel.value) return;
  document.getElementById('task').value = sel.value;
  setTask();
  sel.selectedIndex = 0;
}
async function setTask(){
  await fetch('/api/task', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({task: document.getElementById('task').value})});
}
const RTC_FIELDS = [
  ['fps', '控制频率（Hz）', 'int'],
  ['rtc_lookahead_ratio', '提前请求比例', 'float'],
  ['rtc_blend_steps', '融合步数', 'int'],
  ['rtc_action_ema_alpha', '平滑系数（EMA）', 'float'],
  ['rtc_safety_margin_steps', '安全余量（步）', 'int'],
  ['rtc_latency_window', '延迟统计窗口', 'int'],
  ['action_interp_steps', '插值细分', 'int'],
  ['rtc_enabled', '启用 RTC', 'check'],
  ['rtc_ema_exclude_gripper', '夹爪不做平滑', 'check'],
];
let rtcInit = false;
async function loadRtc(force){
  try{
    const r = await (await fetch('/api/rtc')).json();
    const div = document.getElementById('rtc');
    if(!rtcInit){
      rtcInit = true;
      let html = '<div class="grid">';
      RTC_FIELDS.forEach(([k, label, tp]) => {
        if(tp === 'check')
          html += `<label class="check"><input type="checkbox" id="rtc_${k}">${label}</label>`;
        else
          html += `<label>${label}<input type="number" step="any" id="rtc_${k}"></label>`;
      });
      html += '</div><div class="actions"><button class="primary" onclick="saveRtc()">应用</button><button onclick="loadRtc(true)">恢复为当前值</button></div>';
      div.innerHTML = html;
    }
    // 仅在初始化或手动刷新时填充，不再周期性覆盖用户未保存的编辑
    if(!rtcInit && !force) return;
    RTC_FIELDS.forEach(([k, , tp]) => {
      const el = document.getElementById('rtc_' + k);
      if(!el || (!force && document.activeElement === el)) return;
      if(tp === 'check') el.checked = !!r[k]; else el.value = r[k];
    });
  }catch(e){}
}
async function saveRtc(){
  const body = {};
  RTC_FIELDS.forEach(([k, , tp]) => {
    const el = document.getElementById('rtc_' + k);
    body[k] = tp === 'check' ? el.checked : (tp === 'float' ? parseFloat(el.value) : parseInt(el.value));
  });
  const resp = await fetch('/api/rtc', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const r = await resp.json();
  const msg = document.getElementById('rtcMsg');
  const hint = '修改后点击「应用」，下一个控制周期生效';
  msg.textContent = resp.ok ? '已生效' : ('未生效：' + (r.error || '参数有误'));
  msg.style.color = resp.ok ? 'var(--ok)' : 'var(--bad)';
  setTimeout(() => { msg.textContent = hint; msg.style.color = ''; }, 3000);
  if(resp.ok) loadRtc(true);  // 保存成功后用服务器返回值回填
}
setInterval(tick, 500); setInterval(tickQ, 300); tick(); tickQ(); loadRtc(); loadPresets();
</script></body></html>
