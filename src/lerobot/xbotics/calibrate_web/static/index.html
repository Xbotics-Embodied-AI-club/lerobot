<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>星禾套件 · 标定</title>
    <script type="module" crossorigin src="./assets/index-DSi9X2l4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CsNg8orQ.css">
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">星</span>
          <div class="brand-text">
            <h1>星禾套件 · 标定</h1>
          </div>
        </div>
        <div class="topbar-status">
          <button id="speechToggle" class="btn small ghost speech-toggle" type="button" aria-pressed="true">
            语音：开
          </button>
          <span id="streamIndicator" class="status-pill offline hidden">
            <i></i><span></span>
          </span>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel steps-panel">
          <div class="panel-heading">
            <h2>标定流程</h2>
          </div>

          <div id="deviceSummary" class="device-summary">
            <div class="device-summary-row">
              <span class="label">设备</span>
              <strong id="summaryTarget">未连接</strong>
            </div>
            <div class="device-summary-row">
              <span class="label">端口</span>
              <code id="summaryPort">—</code>
            </div>
            <div class="device-summary-row">
              <span class="label">模式</span>
              <span id="summaryDemo" class="tag">—</span>
            </div>
          </div>

          <ol id="stepList" class="step-list">
            <li data-step="connect">
              <span class="step-index">1</span>
              <div><strong>连接</strong></div>
            </li>
            <li data-step="middle">
              <span class="step-index">2</span>
              <div><strong>中位</strong></div>
            </li>
            <li data-step="ranges">
              <span class="step-index">3</span>
              <div><strong>限位</strong></div>
            </li>
            <li data-step="review">
              <span class="step-index">4</span>
              <div><strong>复核</strong></div>
            </li>
            <li data-step="write">
              <span class="step-index">5</span>
              <div><strong>写入</strong></div>
            </li>
            <li data-step="done">
              <span class="step-index">6</span>
              <div><strong>完成</strong></div>
            </li>
          </ol>

          <section id="reviewSection" class="review-section hidden">
            <div class="section-heading">
              <h3>标定结果</h3>
            </div>
            <div class="table-wrap">
              <table id="reviewTable">
                <thead>
                  <tr>
                    <th>关节</th>
                    <th>候选范围</th>
                    <th>回零偏移</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </section>
        </aside>

        <section class="panel viewer-panel">
          <div class="viewer-toolbar">
            <div class="viewer-title">
              <h2>数字孪生</h2>
            </div>
            <div class="viewer-actions">
              <button id="togglePlay" type="button" class="btn small ghost" disabled>暂停目标动画</button>
              <button id="focusJoint" type="button" class="btn small ghost" disabled>聚焦当前关节</button>
              <button id="resetView" type="button" class="btn small ghost" disabled>视角复位</button>
            </div>
          </div>
          <div id="viewer" class="viewer" aria-label="三维模型">
            <div id="viewerMessage" class="viewer-message">
              <div class="spinner" aria-hidden="true"></div>
              <p>正在加载模型…</p>
            </div>
            <div class="viewer-footnote">
              <span><i class="dot actual"></i>实际</span>
              <span><i class="dot target"></i>目标</span>
            </div>
          </div>
        </section>

        <aside class="panel state-panel">
          <section id="instructionCard" class="instruction-card">
            <h2 id="instructionTitle">等待连接</h2>
            <p id="instructionText"></p>
            <div class="instruction-meta">
              <span id="actionHint" class="muted"></span>
            </div>
          </section>

          <section class="joints-section">
            <div class="panel-heading">
              <h2>关节状态</h2>
              <span id="jointPassCount" class="muted">—</span>
            </div>
            <div id="jointList" class="joint-list"></div>
          </section>
        </aside>
      </main>

      <footer class="actionbar">
        <div class="actionbar-info">
          <span id="footerError" class="footer-error hidden"></span>
        </div>
        <div class="action-buttons">
          <button id="newSessionButton" type="button" class="btn ghost hidden">开始新标定</button>
          <span id="actionButtons" class="action-buttons-inner"></span>
          <button id="cancelButton" type="button" class="btn danger ghost hidden">取消会话</button>
        </div>
      </footer>

      <div id="connectOverlay" class="connect-overlay">
        <div class="connect-card" role="dialog" aria-modal="true" aria-labelledby="connectTitle">
          <div class="connect-heading">
            <span class="brand-mark" aria-hidden="true">星</span>
            <div>
              <h2 id="connectTitle">连接机械臂</h2>
            </div>
          </div>

          <div id="devicesLoading" class="inline-info">正在检测设备端口…</div>
          <div id="devicesError" class="inline-error hidden"></div>

          <div class="target-options" role="radiogroup" aria-label="选择待标定设备">
            <label class="target-option">
              <input type="radio" name="target" value="follower" checked />
              <span class="target-option-body">
                <span class="target-icon follower" aria-hidden="true"></span>
                <span class="target-copy">
                  <strong>从臂</strong>
                  <small id="followerInfo">检测中…</small>
                </span>
                <span class="radio-mark" aria-hidden="true"></span>
              </span>
            </label>
            <label class="target-option">
              <input type="radio" name="target" value="leader" />
              <span class="target-option-body">
                <span class="target-icon leader" aria-hidden="true"></span>
                <span class="target-copy">
                  <strong>主臂</strong>
                  <small id="leaderInfo">检测中…</small>
                </span>
                <span class="radio-mark" aria-hidden="true"></span>
              </span>
            </label>
          </div>

          <div class="port-picker">
            <label for="portSelect">串口</label>
            <select id="portSelect">
              <option value="">正在检测串口…</option>
            </select>
          </div>

          <label class="switch-row" for="demoToggle">
            <input id="demoToggle" type="checkbox" />
            <span class="switch" aria-hidden="true"></span>
            <span class="switch-copy">
              <strong>演示模式</strong>
            </span>
          </label>

          <button id="connectButton" type="button" class="btn primary block">开始标定</button>
          <p id="connectError" class="inline-error hidden"></p>
        </div>
      </div>

      <div id="toast" class="toast hidden" role="status"></div>
    </div>
  </body>
</html>
